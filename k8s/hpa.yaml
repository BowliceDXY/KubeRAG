# 自动扩缩容（HPA）
#
# 说明：这里只保留 Gateway 的 HPA。
# Backend 因 ChromaDB / SQLite 均为本地文件单写者存储，固定 1 副本，
# 多副本扩容会导致数据写冲突（详见 backend.yaml 注释）。
# 待向量库外部化（Qdrant/Weaviate）、对话历史迁移共享数据库后，
# 再为 Backend 增加 CPU/内存 HPA。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: kuberag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
