# FastAPI 后端：RAG 核心服务
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: kuberag
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kuberag
  labels:
    app: backend
spec:
  # 固定 1 副本：ChromaDB（本地文件+SQLite）与 chat_history.db（SQLite）都是单写者存储，
  # 多副本并发写同一 ReadWriteOnce PVC 会锁冲突/数据损坏。需要横向扩容时，
  # 先将向量库外部化（如 Qdrant/Weaviate）、对话历史迁移到共享数据库，再开启多副本。
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kuberag-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9003"]
          ports:
            - containerPort: 9003
          envFrom:
            - configMapRef:
                name: kuberag-config
            - secretRef:
                name: kuberag-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9003
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]  # 优雅退出，等待在途请求完成
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kuberag
spec:
  selector:
    app: backend
  ports:
    - port: 9003
      targetPort: 9003
  type: ClusterIP
