version: "3.8"
services:
  kuberag:
    build: .
    container_name: kuberag
    ports:
      - "9003:9003"
    environment:
      - PORT=9003
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BIGMODEL_API_KEY=${BIGMODEL_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: kuberag-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=:8080
      - BACKEND_URL=http://kuberag:9003
    depends_on:
      - kuberag
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kuberag-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
