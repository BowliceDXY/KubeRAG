# API 密钥 —— 部署前请替换为真实值
# 生产环境建议使用 ExternalSecret 或 SealedSecret 管理
apiVersion: v1
kind: Secret
metadata:
  name: kuberag-secrets
  namespace: kuberag
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  BIGMODEL_API_KEY: "your-bigmodel-api-key"
  TAVILY_API_KEY: "your-tavily-api-key"
